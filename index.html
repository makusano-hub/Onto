<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Busca las atracciones turísticas de la Región de Magallanes por comuna y tipo, y explora sus modelos 3D.">
	<title>Onto — Atracciones turísticas de Magallanes</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<header><nav class="wrap" aria-label="Navegación principal">
		<a class="brand" href="index.html"><span class="mark">o</span>onto</a>
		<div class="links"><a href="#atracciones">Atracciones</a></div>
	</nav></header>
	<main>
		<section class="wrap portada">
			<span class="eyebrow">Región de Magallanes</span>
			<h1>Atracciones turísticas. <span>En 3D.</span></h1>
			<p class="lead">Busca por comuna o tipo de atracción y elige una para explorar su modelo 3D.</p>
		</section>
		<section class="wrap atracciones" id="atracciones" aria-label="Buscar atracciones">
			<div class="filtros">
				<div>
					<p class="titulo-filtro" id="titulo-comuna">Comuna</p>
					<div class="grupo-botones" id="filtro-comuna" role="group" aria-labelledby="titulo-comuna"></div>
				</div>
				<div>
					<p class="titulo-filtro" id="titulo-tipo">Tipo de atracción</p>
					<div class="grupo-botones" id="filtro-tipo" role="group" aria-labelledby="titulo-tipo"></div>
				</div>
			</div>
			<p class="total-atracciones" id="total-atracciones" role="status"></p>
			<ul class="cards lista-atracciones" id="lista-atracciones"></ul>
		</section>
	</main>
	<footer><div class="wrap footer-inner"><a class="brand" href="index.html"><span class="mark">o</span>onto</a><span>© 2026 Onto. Conocimiento conectado.</span></div></footer>
	<script type="module" src="js/inicio.js"></script>
</body>
</html>
